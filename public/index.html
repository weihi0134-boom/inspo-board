<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>靈感收集箱</title>
<style>
  :root{ --bg:#e0f0f5; --card:#ffffff; --card2:#f4f9fb; --line:#cdd9df; --txt:#1a1614; --sub:#6f767c; --brand:#c18c4c; --brand2:#a9743a; --ink:#1a1614; --warn:#b5584f; --ok:#7d9a6d; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;}
  header{position:sticky;top:0;z-index:10;background:rgba(224,240,245,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px;}
  h1{font-size:20px;margin:14px 0 10px;display:flex;align-items:center;gap:8px}
  .tabs{display:flex;gap:8px;padding-bottom:10px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:15px;cursor:pointer}
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  main{padding:16px 0 80px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
  .chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:14px;cursor:pointer}
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:600}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
  .seg{display:flex;gap:6px;margin-bottom:10px}
  .seg button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:14px;cursor:pointer}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  input,textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:15px;font-family:inherit}
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:8px;margin-top:8px}
  .btn{padding:11px 16px;border-radius:10px;border:none;background:var(--brand);color:#fff;font-size:15px;cursor:pointer;font-weight:700}
  .btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:400}
  .btn.rec{background:#c05a4d;color:#fff}
  .btn:disabled{opacity:.5}
  .muted{color:var(--sub);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .card h3{margin:0 0 6px;font-size:15px}
  .card a{color:var(--brand2);word-break:break-all}
  .card audio{width:100%;margin-top:6px}
  .card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .del{background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer}
  .banner{display:flex;gap:10px;margin-bottom:14px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
  .stat b{display:block;font-size:24px;color:var(--brand)}
  .stat span{font-size:12px;color:var(--sub)}
  .cols{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:720px){.cols{grid-template-columns:1fr 1fr 1fr}}
  .col{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
  .col h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%}
  .tcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
  .tcard p{margin:0 0 6px;font-size:14px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#efe3d3;color:var(--brand2);margin-top:4px}
  .tag.due{color:var(--warn)}
  .mv{display:flex;gap:6px;margin-top:6px}
  .mv button{flex:1;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12px;cursor:pointer}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:14px 0}
  .hidden{display:none}
  .exec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
  .exec h2{font-size:14px;margin:0 0 8px;color:var(--brand2)}
  .exec li{font-size:13px;margin:4px 0}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>💡 靈感收集箱</h1>
    <div class="tabs">
      <div class="tab active" data-view="ideas" onclick="switchView('ideas')">💡 靈感</div>
      <div class="tab" data-view="board" onclick="switchView('board')">✅ 待辦事項看板</div>
    </div>
  </div>
</header>
<main class="wrap">
  <section id="view-ideas"></section>
  <section id="view-board" class="hidden"></section>
</main>
<script src="/app.js"></script>
</body>
</html>
