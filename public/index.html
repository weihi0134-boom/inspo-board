<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#e0f0f5" />
<title>小薇正在輸入中...</title>
<style>
  :root{
    --bg:#e0f0f5; --card:#ffffff; --card2:#f7fbfc; --line:#dbe6ea;
    --txt:#1a1614; --sub:#7b848a;
    --sand:#ecd9bf; --sand-d:#dcc4a3; --sand-t:#f7efe4; --sand-ink:#4a3a28;
    --ok:#7d9a6d; --warn:#c05a4d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  header{position:sticky;top:0;z-index:10;background:rgba(224,240,245,.93);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .wrap{max-width:900px;margin:0 auto;padding:0 16px;}
  h1{font-size:19px;margin:14px 0 12px;display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.5px}
  .tabs{display:flex;gap:8px;padding-bottom:12px}
  .tab{flex:1;text-align:center;padding:11px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:15px;cursor:pointer;transition:.15s}
  .tab.active{background:var(--sand);color:var(--sand-ink);border-color:var(--sand);font-weight:700}
  main{padding:16px 0 90px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--sub);font-size:14px;cursor:pointer;transition:.15s}
  .chip.active{background:var(--sand);color:var(--sand-ink);border-color:var(--sand);font-weight:700}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
  .panel h4{margin:0 0 10px;font-size:13px;color:var(--sub);font-weight:600}
  .seg{display:flex;gap:6px;margin-bottom:14px}
  .seg button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--sub);font-size:14px;cursor:pointer;transition:.15s}
  .seg button.on{background:var(--sand);color:var(--sand-ink);border-color:var(--sand);font-weight:700}
  input,textarea,select{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:15px;font-family:inherit;outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--sand);background:#fff}
  textarea{min-height:76px;resize:vertical}
  .field{margin-bottom:10px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px;font-weight:600}
  .row{display:flex;gap:8px;margin-top:8px}
  .btn{padding:12px 16px;border-radius:11px;border:1px solid #e2d0b8;background:var(--sand);color:var(--sand-ink);font-size:15px;cursor:pointer;font-weight:700;transition:.15s}
  .btn:hover{background:var(--sand-d)}
  .btn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:500}
  .btn.ghost:hover{background:var(--sand-t)}
  .btn.rec{background:var(--card2);color:var(--txt);border:1px solid var(--line);font-weight:500}
  .btn.rec:hover{background:var(--sand-t)}
  .btn:disabled{opacity:.5}
  .muted{color:var(--sub);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .card h3{margin:0 0 7px;font-size:15px;font-weight:700}
  .card a{color:#8a6134;word-break:break-all}
  .card audio{width:100%;margin-top:8px;height:38px}
  .card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .thumbs img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
  .del{background:none;border:none;color:var(--sub);font-size:13px;cursor:pointer}
  .del:hover{color:var(--warn)}
  .banner{display:flex;gap:10px;margin-bottom:14px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
  .stat b{display:block;font-size:24px;color:var(--sand-d);font-weight:800}
  .stat span{font-size:12px;color:var(--sub)}
  .cols{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:740px){.cols{grid-template-columns:1fr 1fr 1fr}}
  .col{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
  .col h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:6px;font-weight:700}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  .tcard{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}
  .tcard p{margin:0 0 6px;font-size:14px;line-height:1.45}
  .tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--sand-t);color:#8a6134;margin:2px 4px 0 0}
  .tag.due{background:#e9eef0;color:#5b6b73}
  .mv{display:flex;gap:6px;margin-top:8px}
  .mv button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:12px;cursor:pointer}
  .mv button:hover{background:var(--sand-t);color:var(--sand-ink);border-color:var(--sand)}
  .empty{color:var(--sub);font-size:13px;text-align:center;padding:18px 0}
  .hidden{display:none}
  .exec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .exec h2{font-size:14px;margin:0 0 8px;color:#8a6134;font-weight:700}
  .exec li{font-size:13px;margin:5px 0}
  .sub{font-size:13px;color:var(--sub);margin:0 0 12px;line-height:1.6}
  .calbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:16px}
  .calbox iframe{width:100%;height:560px;border:0;border-radius:12px;background:#f7fbfc}
  .calbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .calbtns button{flex:1;min-width:120px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:13px;cursor:pointer}
  .calbtns button:hover{background:var(--sand-t);border-color:var(--sand)}
  .calbtns button.on{background:var(--sand);color:var(--sand-ink);border-color:var(--sand);font-weight:700}
  .lightbox{position:fixed;inset:0;background:rgba(26,22,20,.82);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px}
  .lightbox img{max-width:100%;max-height:90vh;border-radius:12px}

  .listhead{font-size:13px;color:var(--sub);font-weight:700;margin:18px 2px 10px;letter-spacing:.4px}
  .card .tag.fold{background:#eef6f8;color:#5b7b86}
  .card .meta{gap:8px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .calhead{font-size:11px;color:var(--sub);text-align:center;padding-bottom:2px;font-weight:700}
  .calcell{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px;min-height:78px;overflow:hidden}
  .calcell.dim{opacity:.4}
  .calcell.today{border-color:var(--sand-d);background:var(--sand-t)}
  .caldate{font-size:12px;font-weight:700;color:#5b6b73;margin-bottom:3px}
  .calev{font-size:10.5px;line-height:1.3;background:#fff;border-radius:6px;padding:2px 4px;margin-bottom:2px;color:#33505b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .calmore{font-size:10px;color:var(--sub)}
  .calnav{display:flex;gap:8px;margin:0 0 10px}
  .calnav button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--txt);font-size:13px;cursor:pointer}
  .calnav button.on{background:var(--sand);color:var(--sand-ink);border-color:var(--sand-d);font-weight:700}
  .calmon{font-size:9.5px;color:var(--sub);font-weight:500}
  .calnav button:hover{background:var(--sand-t);border-color:var(--sand)}
  .daybox{background:#fff;border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:80vh;overflow:auto}
  .daybox h4{margin:0 0 10px;font-size:15px}
  .btn.teal{background:var(--sand);color:var(--sand-ink);border:1px solid var(--sand-d)}
  .calmore{cursor:pointer;color:#8a6134}
  .calcell{cursor:pointer}
  .calmonth{margin-bottom:14px}
  .calmonth h4{margin:0 0 6px;font-size:13px;color:#8a6134}
  /* 收納式標題 */
  .fold{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;background:var(--card2)}
  .foldhead{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;background:#fff;border:none;border-bottom:1px solid transparent;font-size:13.5px;font-weight:700;color:var(--txt);cursor:pointer;font-family:inherit;text-align:left}
  .foldhead.static{border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
  .fold.open .foldhead{border-bottom-color:var(--line)}
  .foldbody{display:none;padding:4px 14px 10px}
  .fold.open .foldbody{display:block}
  .foldhead .chev{color:var(--sub);font-size:12px;transition:transform .2s}
  @keyframes groomNod{0%,100%{transform:rotate(0)}50%{transform:rotate(-12deg) translateY(2px)}}
  .calrow{font-size:13px;padding:7px 2px;border-bottom:1px solid var(--line)}
  .calrow b{color:#8a6134;margin-right:6px}
  .calrow span{color:var(--sub);margin-right:6px;font-size:12px}

  /* ===== 品牌標題（IG 輸入中動畫） ===== */
  .brand{font-size:19px;letter-spacing:.6px}
  .typing{display:inline-flex;align-items:center;gap:4px;margin-left:2px;padding:6px 10px;background:#fff;border:1px solid var(--line);border-radius:999px}
  .typing i{width:6px;height:6px;border-radius:50%;background:#9aa7ad;display:block;animation:typing 1.35s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-4px);opacity:1}}
  @media(prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.7}.cat-stage,#cat-run{display:none!important}}

  /* ===== 小黑貓 ===== */
  .cat-stage{position:fixed;left:0;right:0;bottom:0;height:0;pointer-events:none;z-index:8}
  .cat-stage svg{position:absolute;bottom:0;width:64px;height:64px;transform:translateX(0);transition:transform .9s cubic-bezier(.45,.05,.55,.95);overflow:visible}
  .cat-stage svg.walk .leg{animation:legA .42s infinite alternate ease-in-out}
  .cat-stage svg.walk .leg.b{animation-name:legB}
  @keyframes legA{from{transform:rotate(0)}to{transform:rotate(16deg)}}
  @keyframes legB{from{transform:rotate(0)}to{transform:rotate(-16deg)}}
  .cat-stage svg .tail{transform-origin:0 0;animation:tailWag 1.6s infinite ease-in-out}
  @keyframes tailWag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
  .cat-stage svg .eye{transition:transform .1s}
  .cat-stage svg.sleep .eye{transform:scaleY(.12)}
  .cat-stage svg .blink{animation:blink 5s infinite}
  @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .cat-stage svg .stretch{transform-origin:50% 100%;animation:stretch 1.8s ease-in-out}
  @keyframes stretch{0%,100%{transform:scaleX(1) scaleY(1)}45%{transform:scaleX(1.16) scaleY(.88)}}
  .cat-zzz{position:absolute;bottom:56px;font-size:13px;color:#7b848a;opacity:0;transition:opacity .4s;pointer-events:none}
  .cat-zzz.on{opacity:1;animation:zzz 2.4s infinite ease-in-out}
  @keyframes zzz{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-9px);opacity:1}}
  .cat-badge{position:fixed;right:12px;bottom:10px;z-index:9;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:11px;color:var(--sub);cursor:pointer;backdrop-filter:blur(6px)}
  .hint{background:var(--sand-t);border-radius:12px;padding:12px 14px;font-size:13px;color:#7a5832;line-height:1.7;margin-bottom:14px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 class="brand">小薇正在輸入中<span class="typing"><i></i><i></i><i></i></span></h1>
    <div class="cat-badge" onclick="toggleCat()">🐈 小貓</div>
    <div class="tabs">
      <div class="tab active" data-view="ideas" onclick="switchView('ideas')">💡 靈感</div>
      <div class="tab" data-view="board" onclick="switchView('board')">✅ 待辦事項看板</div>
      <div class="tab" data-view="calendar" onclick="switchView('calendar')">📅 行事曆</div>
    </div>
  </div>
</header>
<main class="wrap">
  <section id="view-ideas"></section>
  <section id="view-board" class="hidden"></section>
  <section id="view-calendar" class="hidden"></section>
</main>

<div class="cat-stage" id="cat-stage">
  <div class="cat-zzz" id="cat-zzz">z z Z</div>
  <svg id="cat-run" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g id="cat-body">
      <path class="tail" d="M20 50 C8 50 6 38 14 36 C18 35 19 40 16 41" fill="none" stroke="#1a1614" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="34" cy="46" rx="16" ry="10" fill="#1a1614"/>
      <circle cx="48" cy="36" r="10" fill="#1a1614"/>
      <path d="M41 29 L45 21 L49 29 Z" fill="#1a1614"/>
      <path d="M49 28 L54 21 L56 30 Z" fill="#1a1614"/>
      <ellipse class="eye" cx="46" cy="36" rx="2.1" ry="2.6" fill="#ffd94a"/>
      <ellipse class="eye" cx="53" cy="36" rx="2.1" ry="2.6" fill="#ffd94a"/>
      <rect class="leg" x="26" y="52" width="4.5" height="9" rx="2.2" fill="#1a1614"/>
      <rect class="leg b" x="40" y="52" width="4.5" height="9" rx="2.2" fill="#1a1614"/>
    </g>
  </svg>
</div>
<script src="/app.js"></script>
</body>
</html>
